[tox]
minversion = 4.0.0
envlist = check,types,format-check,test,coverage

[testenv]
install_command = uv pip install {opts} {packages}
skip_install = true
allowlist_externals = git, uv
passenv =
    CI
    USER
    USERNAME
    SSH_AUTH_SOCK
    CI_*
    GIT_*
    UV_*
    CHIEF_LEAK_DENYLIST
    CHIEF_LEAK_BASELINE
    CHIEF_LEAK_STRICT
setenv =
    UV_NO_CONFIG = 1
    PIP_CONFIG_FILE = /dev/null
    NPM_CONFIG_USERCONFIG = /dev/null

[testenv:format]
description = Autoformat code.
deps =
    ruff
commands =
    ruff check --select I --fix {posargs}
    ruff format {posargs} --silent
    ruff check {posargs} --select COM --silent --fix
    ruff format {posargs}

[testenv:format-check]
description = Check code format using ruff.
deps =
    ruff
commands =
    ruff format --check {posargs}
    ruff check --select I {posargs}

[testenv:check]
description = Check code style, complexity, docstrings, errors and security with ruff.
deps =
    ruff
commands =
    ruff check {posargs}

[testenv:{codestyle,docstyle,errors,security}]
description = DEPRECATED - Use 'tox -e check'.
base = check, testenv
commands =
    python -c "print('DEPRECATED: tox -e {env_name} was replaced by tox -e check')"
    {[testenv:check]commands}

[testenv:lint]
description = Check code for stylistic, logical and security errors as well as types.
skip_install = false
deps =
    {[testenv:check]deps}
    {[testenv:types]deps}
dependency_groups =
    {[testenv:types]dependency_groups}
commands =
    {[testenv:check]commands}
    {[testenv:types]commands}

[testenv:types]
description = Run static type checker.
skip_install = false
deps =
    ty
dependency_groups = test
commands =
    ty check {posargs}

[testenv:test-pytest]
description = Run tests with pytest for active python environment (no coverage).
skip_install = false
dependency_groups = test
commands =
    pytest tests {posargs}

[testenv:test]
description = Run tests with pytest and coverage calculation.
skip_install = false
setenv =
    {[testenv]setenv}
    COVERAGE_FILE = .coverage.{env:OS:linux}
dependency_groups = test
commands =
    pytest --cov --cov-report= tests {posargs}

[testenv:coverage]
description = Measure, combine and report coverage.
deps =
    coverage[toml] >= 6.0
commands =
    coverage combine
    coverage report
    coverage xml
    coverage html --fail-under {posargs:50}

[testenv:_venv_package]
description = Just create venv with package installed.
skip_install = false

[testenv:sbom]
description = Create an SBOM (Software Bill of Materials) for the project.
allowlist_externals = mkdir, tox, uv
deps =
    cyclonedx-bom
commands =
    tox -e _venv_package
    mkdir -p sbom
    cyclonedx-py environment '.tox/_venv_package' --gather-license-texts --output-format JSON -o sbom/chief.sbom.json

[testenv:clean]
description = Remove all generated and temporary files.
deps =
    coverage[toml]
commands =
    coverage erase
    git clean -xfd --exclude .tox/**/clean

[testenv:docs]
description = Generate API documentation.
skip_install = false
changedir = docs
dependency_groups = docs
commands =
    sphinx-build -W -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:build]
description = Build package.
passenv =
    SETUPTOOLS_SCM_PRETEND_*
commands =
    git clean -xfd dist/
    uv build
